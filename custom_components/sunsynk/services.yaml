backup_settings:
  name: Back Up Settings
  description: >
    Save everything the inverter reports in its settings to
    /config/sunsynk_backups/<serial>_<date>.json. Returns the file name.
  fields:
    serial:
      name: Inverter Serial
      description: The inverter to back up.
      required: true
      selector:
        text:

restore_settings:
  name: Restore Settings
  description: >
    Put back the settings from a backup: only those this integration can write
    and check, and only where they differ from the inverter now. By default
    only lists what would change (dry run); set Dry Run off to write. Refused
    while Tariff Manager or the Virtual Slot Scheduler are driving the inverter.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:
    file:
      name: Backup File
      description: The file name in /config/sunsynk_backups, e.g. 2301316667_20261021-180000.json.
      required: true
      selector:
        text:
    dry_run:
      name: Dry Run
      description: Only list what would change. Turn off to write the settings.
      required: false
      default: true
      selector:
        boolean:

charge_now_start:
  name: Charge Now
  description: >
    Charge the battery now, from the grid if needed, at the Tariff Manager's
    cheap-rate charge current up to its target SOC, whatever the price and
    whether Tariff Manager is on or off. Needs the Virtual Slot Scheduler on to
    charge from the grid. Stops with Charge Now Stop, after the duration, or
    when Tariff Manager is switched off or Home Assistant restarts.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:
    duration:
      name: Duration
      description: Minutes to charge for. Without it, until stopped.
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    current:
      name: Current
      description: Charge current in A. Without it, the Charge now option, else the cheap-rate current. Some inverters (e.g. three-phase) keep to the slot power instead.
      required: false
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: A
          mode: box
    target_soc:
      name: Target SOC
      description: Charge up to this SOC. Without it, the Charge now option, else the cheap-rate target.
      required: false
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"
          mode: box
    power:
      name: Charge Power
      description: The timer slot's power on each inverter, e.g. 3000 for 3 kW. Without it, the rated power.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: W
          mode: box

charge_now_stop:
  name: Charge Now Stop
  description: Stop a charge started with Charge Now. Tariff Manager then decides by price again.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:

discharge_now_start:
  name: Discharge Now
  description: >
    Discharge the battery now, exporting to the grid, at the Tariff Manager's
    peak discharge current down to its minimum SOC, whatever the price and
    whether Tariff Manager is on or off. Needs the Virtual Slot Scheduler on to
    export. Stops with Discharge Now Stop, after the duration, at the minimum
    SOC, or when Tariff Manager is switched off or Home Assistant restarts.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:
    duration:
      name: Duration
      description: Minutes to discharge for. Without it, until stopped or the minimum SOC.
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: min
          mode: box
    current:
      name: Current
      description: Discharge current in A. Without it, the Discharge now option, else the peak discharge current. Some inverters (e.g. three-phase) keep to the export power instead.
      required: false
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: A
          mode: box
    min_soc:
      name: Minimum SOC
      description: Stop at this SOC. Without it, the Discharge now option, else the Tariff Manager minimum.
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
          mode: box
    power:
      name: Export Power
      description: The most to export on each inverter, e.g. 3000 for 3 kW. Without it, the Discharge now option, else the maximum export power or the rated power.
      required: false
      selector:
        number:
          min: 1
          max: 100000
          unit_of_measurement: W
          mode: box

discharge_now_stop:
  name: Discharge Now Stop
  description: Stop a discharge started with Discharge Now. Tariff Manager then decides by price again.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:

force_charge:
  name: Force Charge
  description: >
    Set the battery charge current to a specific value.
    Call again with your normal value to restore.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:
    current:
      name: Charge Current
      description: Charge current in Amperes (0 = stop charging).
      required: true
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: A

force_discharge:
  name: Force Discharge
  description: >
    Set the battery discharge current to a specific value.
    Call again with your normal value to restore.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:
    current:
      name: Discharge Current
      description: Discharge current in Amperes (0 = stop discharging).
      required: true
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: A

set_virtual_slot:
  name: Set Virtual Slot
  description: >
    Define or replace one of up to 10 HA-side virtual charge/discharge slots.
    While there is something to do, the Virtual Slot Scheduler writes them onto
    the inverter's six time slots: slot 1 holds the earlier boundary and slots
    2-6 the later one. With nothing to do, your own timer stays. A live price
    override from the Tariff Manager always takes precedence over the virtual
    schedule while active.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter schedule. A parallel slave shares its master's schedule.
      required: true
      selector:
        text:
    slot_id:
      name: Virtual Slot ID
      description: 1-10. Calling again with the same ID replaces that slot.
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box
    start:
      name: Start Time
      description: "Window start, HH:MM (24h). Some inverters only act on :00/:30 minute values — if a finer value seems to do nothing on yours, use :00/:30."
      required: true
      selector:
        text:
    end:
      name: End Time
      description: "Window end, HH:MM (24h). May be before start to wrap past midnight. Some inverters only act on :00/:30 minute values — if a finer value seems to do nothing on yours, use :00/:30."
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: What the inverter should do during this window.
      required: true
      selector:
        select:
          options:
            - charge
            - discharge
            - idle
    weekdays:
      name: Weekdays
      description: Days this slot applies to. Omit for every day.
      required: false
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    current:
      name: Current
      description: chargeCurrent (mode charge) or dischargeCurrent (mode discharge), in Amps.
      required: false
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: A
    target_soc:
      name: Target / Minimum SOC
      description: Stop charging at this SOC (mode charge) or stop discharging below it (mode discharge).
      required: false
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    sell_power:
      name: Sell Power
      description: Max export power in Watts while discharging (mode discharge only).
      required: false
      selector:
        number:
          min: 0
          max: 30000
          unit_of_measurement: W
    priority:
      name: Priority
      description: Higher wins when two virtual slots' time windows overlap.
      required: false
      selector:
        number:
          min: 0
          max: 100
          mode: box
    enabled:
      name: Enabled
      description: Uncheck to keep the slot's definition without it being scheduled.
      required: false
      selector:
        boolean:

clear_virtual_slot:
  name: Clear Virtual Slot
  description: Remove a previously defined virtual slot.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter schedule. A parallel slave shares its master's schedule.
      required: true
      selector:
        text:
    slot_id:
      name: Virtual Slot ID
      description: 1-10.
      required: true
      selector:
        number:
          min: 1
          max: 10
          mode: box

set_work_mode:
  name: Set Work Mode
  description: >
    Set the inverter's System Work Mode:
    0 = Selling First, 1 = Zero Export + Limit to Load Only,
    2 = Limited to Home. The System Work Mode select entity does the same.
  fields:
    serial:
      name: Inverter Serial
      description: Exactly one target inverter. A parallel slave is routed to its master.
      required: true
      selector:
        text:
    mode:
      name: Work Mode
      description: 0 = Selling First, 1 = Zero Export + Limit to Load Only, 2 = Limited to Home.
      required: true
      selector:
        number:
          min: 0
          max: 2
          mode: box
