name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum-ha
            python: "3.11"
            requirements: requirements_test_min.txt
            # Compatibility lane: newer-HA code paths can't run here and the
            # pinned coverage.py doesn't exclude TYPE_CHECKING blocks. The
            # 100% gate is enforced by current-ha.
            pytest_args: --cov-fail-under=0
          - name: current-ha
            python: "3.14"
            requirements: requirements_test.txt
    name: pytest (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: pip install -r "${{ matrix.requirements }}"
      - name: Run tests
        run: pytest --tb=short ${{ matrix.pytest_args }}
