name: Tests

on:
  push:
    # Tags are tested by the Release workflow, which waits for the result.
    branches: ["**"]
  pull_request:
  workflow_call:

permissions: {}

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum-ha
            python: "3.11"
            requirements: requirements_test_min.txt
            # Compatibility lane: newer-HA code paths can't run here and the
            # pinned coverage.py doesn't exclude TYPE_CHECKING blocks. The
            # 100% gate is enforced by current-ha.
            pytest_args: --cov-fail-under=0
          - name: current-ha
            python: "3.14"
            requirements: requirements_test.txt
    name: pytest (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install dependencies
        run: pip install -r "${{ matrix.requirements }}"
      - name: Run tests
        run: pytest --tb=short ${{ matrix.pytest_args }}
